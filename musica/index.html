<html lang="it">
<head>

<meta charset="utf-8">

<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<title>Atlante Musica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: lettore stile Apple Music; titoli grandi, barra schede in basso, mini player sospeso, player a tutto schermo */
:root{
  --bg:#ffffff; --bg2:#f2f2f7; --fg:#000000; --fg2:rgba(60,60,67,.6); --fg3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.22); --fill:rgba(118,118,128,.12); --accent:#fa2d48; --onaccent:#ffffff;
  --bar:rgba(250,250,250,.86); --sheet:#ffffff; --scrim:rgba(0,0,0,.35); --tab:#8e8e93;
  --ph1:#e5e5ea; --ph2:#d1d1d6; --phi:#aeaeb2; --shadow:0 4px 14px rgba(0,0,0,.12);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --bg2:#1c1c1e; --fg:#ffffff; --fg2:rgba(235,235,245,.6); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --accent:#fc3c54; --onaccent:#ffffff;
  --bar:rgba(22,22,24,.86); --sheet:#2c2c2e; --scrim:rgba(0,0,0,.55); --tab:#8e8e93;
  --ph1:#2c2c2e; --ph2:#3a3a3c; --phi:#636366; --shadow:0 4px 14px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --bg2:#1c1c1e; --fg:#ffffff; --fg2:rgba(235,235,245,.6); --fg3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.6); --fill:rgba(118,118,128,.24); --accent:#fc3c54; --onaccent:#ffffff;
  --bar:rgba(22,22,24,.86); --sheet:#2c2c2e; --scrim:rgba(0,0,0,.55); --tab:#8e8e93;
  --ph1:#2c2c2e; --ph2:#3a3a3c; --phi:#636366; --shadow:0 4px 14px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.3 var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer}
button:focus-visible,input:focus-visible,.tap:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:1em;height:1em;display:block;flex:none}
img{max-width:100%;display:block}

#view{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px calc(150px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px;gap:12px}
.top>:nth-child(2){flex:none}
.top>.back:nth-child(2){min-width:44px;justify-content:flex-end}
.back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding:8px 8px 8px 0;margin-left:-6px;min-width:0}
.back svg{font-size:26px}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.round{width:32px;height:32px;border-radius:50%;background:var(--fill);color:var(--accent);display:grid;place-items:center;font-size:18px;flex:none}
.lt{font-size:34px;line-height:1.15;font-weight:700;letter-spacing:.012em;margin:2px 0 14px;text-wrap:balance}
.lt-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt-row .round{margin-bottom:18px}
.lt-btns{display:flex;gap:10px}
#mini.rc .mt span{color:var(--accent)}
.npdev{display:flex;align-items:center;justify-content:center;gap:8px;margin:-4px auto 12px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.16);font-size:13px;font-weight:600;max-width:100%}
.npdev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npdev svg{font-size:17px;flex:none}
.grp>button .l.dv{min-width:0;padding:8px 0}
.grp>button .l.dv b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp>button .l.dv small{display:block;font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h2{font-size:22px;font-weight:700;letter-spacing:.01em;margin:28px 0 10px;display:flex;align-items:center;gap:4px}
.h2 .chev{color:var(--fg2);font-size:20px}
.sub{color:var(--fg2);font-size:15px}

/* righe libreria */
.lrows{border-top:.5px solid var(--sep)}
.lrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:52px;border-bottom:.5px solid var(--sep);font-size:21px}
.lrow .ic{color:var(--accent);font-size:24px;width:28px;display:grid;place-items:center}
.lrow .t{flex:1;min-width:0}
.lrow .chev{color:var(--fg3);font-size:18px}
.lrow small{display:block;font-size:13px;color:var(--fg2);margin-top:1px}
.sw{flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:#34c759}
.sw.on::after{transform:translateX(20px)}

/* griglia album */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
@media (max-width:420px){.grid{grid-template-columns:1fr 1fr}}
.tile{display:block;text-align:left;min-width:0}
.tile .art{width:100%;aspect-ratio:1;border-radius:8px}
.tile .n{font-size:15px;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .a{font-size:15px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:clamp(140px,40vw,180px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.shelf::-webkit-scrollbar{display:none}
.shelf>*{scroll-snap-align:start}

/* copertine */
.art{display:block;position:relative;overflow:hidden;background:linear-gradient(160deg,var(--ph1),var(--ph2));flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.06)}
.art img{width:100%;height:100%;object-fit:cover}
.art .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--phi)}
.art .ph svg{width:42%;height:42%}
.mosaic{display:grid;grid-template-columns:1fr 1fr;width:100%;height:100%}
.mosaic img{width:100%;height:100%;object-fit:cover}
.av{border-radius:50%!important}

/* righe brani */
.trk{display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:12px;width:100%;text-align:left;min-height:60px}
.trk .art{width:48px;height:48px;border-radius:5px}
.trk .num{width:26px;text-align:center;color:var(--fg2);font-size:16px;font-variant-numeric:tabular-nums}
.trk .rt{display:flex;align-items:center;gap:6px;align-self:stretch;border-bottom:.5px solid var(--sep);min-width:0}
.trk .tx{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;padding-block:8px}
.trk .t1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk .t2{font-size:14px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.trk .fav{color:var(--accent);font-size:12px}
.trk .fav svg{display:inline-block;vertical-align:-1px}
.morerows{height:1px;grid-column:1/-1}
.vl{overflow-anchor:none}.vl>*{height:var(--vh,auto)}
.trk .more{width:36px;height:44px;display:grid;place-items:center;color:var(--fg);font-size:20px;flex:none}
.trk.cur .t1{color:var(--accent)}
.trk .eq{display:none}
.trk.cur .eq{display:flex}
.trk.cur .num .nn{display:none}
.trk .num{display:flex;justify-content:center}
.eq{gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--accent);border-radius:1px;height:40%;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
.paused .eq i{animation-play-state:paused}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.trk .pickc{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--fg3);display:grid;place-items:center;color:#fff;font-size:15px;flex:none;margin-right:6px}
.trk.on .pickc{background:var(--accent);border-color:var(--accent)}

/* intestazione album / playlist */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;margin:6px 0 18px}
.hero .art{width:min(68vw,270px);aspect-ratio:1;border-radius:10px;box-shadow:var(--shadow);margin-bottom:14px}
.hero .ht{font-size:22px;font-weight:600;text-wrap:balance}
.hero .ha{font-size:20px;color:var(--accent)}
.hero .hm{font-size:13px;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;font-weight:600;margin-top:2px}
@media (min-width:760px){.hero{flex-direction:row;align-items:flex-end;text-align:left;gap:24px}.hero .art{margin:0;width:240px}.hero .hb{display:flex;flex-direction:column;gap:4px}}
.pbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:0 0 14px}
.pbtns button{height:48px;border-radius:10px;background:var(--fill);color:var(--accent);font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.pbtns svg{font-size:18px}
@media (min-width:760px){.pbtns{max-width:420px}}
.foot{color:var(--fg2);font-size:15px;margin-top:14px}

/* vuoto */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 12px 24px;max-width:420px;margin:0 auto}
.empty .big{font-size:64px;color:var(--fg3)}
.empty h3{margin:6px 0 0;font-size:22px}
.empty p{margin:0;color:var(--fg2);font-size:16px;line-height:1.4}
.cta{margin-top:12px;background:var(--accent);color:var(--onaccent);font-weight:600;height:50px;padding:0 26px;border-radius:12px;display:inline-flex;align-items:center;gap:8px}
.mixcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--bg2);border-radius:12px;padding:14px;margin-bottom:6px}
.mixcard .mi{width:56px;height:56px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:26px;flex:none}
.mixcard b{display:block;font-size:17px}
.mixcard>span>span{color:var(--fg2);font-size:14px}
.banner{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:12px;padding:12px 14px;margin:4px 0 10px;font-size:15px}
.banner .bt{flex:1;min-width:0}
.banner .bx{color:var(--fg2);font-size:20px;width:28px;height:28px;display:grid;place-items:center}
.banner .ba{color:var(--accent);font-weight:600;text-decoration:none}
/* Playlist di Atlante e «Crea con l'IA» */
.atlg{font-size:13px;font-weight:600;color:var(--fg2);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 14px}
.chip{background:var(--fill);border-radius:99px;padding:5px 11px;font-size:13px;color:var(--fg2)}
.sform textarea{font:inherit;color:var(--fg);background:var(--fill);border:0;border-radius:10px;padding:10px 12px;outline:none;resize:none;min-height:88px}
/* «Per ritmo» e «Mettimi di buonumore» */
.ritart{display:flex!important;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.ritart .rn{font-size:28px;font-weight:800;line-height:1.1;display:flex}.ritart .rn svg{font-size:40px}
.ritart .ru{font-size:13px;font-weight:600;opacity:.85;margin-top:2px}
.ritg{display:flex;flex-wrap:wrap;gap:10px}
.ritb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 14px;border-radius:12px;background:var(--c,var(--fill));color:#fff;min-width:96px;text-align:left}
.ritb b{font-size:18px}.ritb span{font-size:13px;opacity:.9}
.ritb.mio{flex-direction:row;align-items:center;background:var(--fill);color:var(--fg);padding:0 4px 0 0}
.ritb.mio>button:first-child{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 6px 10px 14px;text-align:left}
.ritb.mio .x{width:32px;height:32px;display:grid;place-items:center;color:var(--fg2)}
.ritbox{display:flex;flex-direction:column;gap:10px}.ritl{font-weight:600}.ritr{width:100%;accent-color:var(--accent)}
.ritrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ritrow input{font:inherit;color:var(--fg);background:var(--fill);border:0;border-radius:10px;height:40px;width:84px;padding:0 10px;outline:none}
.ritrow button{height:40px;padding:0 14px;border-radius:10px;background:var(--fill);color:var(--accent);font-weight:600}
.chip.on{background:var(--accent);color:#fff;display:inline-flex;align-items:center;gap:4px}.chip button{color:inherit;display:grid;place-items:center;font-size:12px}
.ritconta{font-size:17px;font-weight:600;margin:4px 0}.bpmb{color:var(--accent);font-weight:600}
.npbpm{margin:-4px auto 10px;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.16);font-size:13px;font-weight:600;color:#fff}
.bncard .mi{background:#ff9f0a}

/* cerca */
.sbox{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:4px 0 10px;display:flex;align-items:center;gap:8px}
.sfield{flex:1;display:flex;align-items:center;gap:6px;background:var(--fill);border-radius:10px;height:38px;padding:0 10px;color:var(--fg2)}
.sfield input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--fg);outline:none;height:100%}
.sfield input::placeholder{color:var(--fg2)}
.sfield input::-webkit-search-cancel-button{display:none}
.sclear{color:var(--fg2);font-size:16px;width:24px;height:24px;display:grid;place-items:center}

/* mini player */
#mini{position:fixed;z-index:30;left:0;right:0;margin:0 auto;bottom:calc(58px + env(safe-area-inset-bottom,0px));width:calc(100% - 16px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));max-width:640px;height:58px;border-radius:16px;background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);box-shadow:0 6px 24px rgba(0,0,0,.18),inset 0 0 0 .5px var(--sep);display:flex;align-items:center;gap:10px;padding:0 6px 0 8px}
#mini .art{width:42px;height:42px;border-radius:7px}
#mini .mt{flex:1;min-width:0;text-align:left;height:100%;display:flex;flex-direction:column;justify-content:center}
#mini .mt b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mt span{font-size:13px;color:var(--fg2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .mb{width:42px;height:42px;display:grid;place-items:center;font-size:24px}

/* barra schede */
#tabs{position:fixed;z-index:31;left:0;right:0;bottom:0;padding:0 env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);background:var(--bar);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border-top:.5px solid var(--sep)}
#tabs .in{display:grid;grid-template-columns:repeat(4,1fr);max-width:640px;margin:0 auto;height:52px}
#tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--tab);font-size:10.5px;font-weight:500}
#tabs button svg{font-size:25px}
#tabs button.on{color:var(--accent)}

/* moduli extra (scheda Altro): riquadro sopra la pagina, sotto mini player e schede; la musica continua */
#xp{position:fixed;z-index:29;inset:0;background:var(--bg)}
#xp iframe{width:100%;height:calc(100% - 52px - env(safe-area-inset-bottom,0px));border:0;display:block;background:var(--bg)}
body.hasmini #xp iframe{height:calc(100% - 122px - env(safe-area-inset-bottom,0px))}
/* il navigatore ha già i suoi comandi della musica, grandi per l'auto */
body.xnav #mini{display:none}
body.xnav #xp iframe{height:calc(100% - 52px - env(safe-area-inset-bottom,0px))}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:6px 0 18px}
.xnote{color:var(--fg2);font-size:15px;margin:4px 4px 18px}
/* YouTube blocca le richieste del Mac mini (classifica di YouTube Music, videoclip): il riquadro Gestione in rosso */
.xtile.xyt{box-shadow:inset 0 0 0 2px #ff3b30}
.xtile.xyt::after{content:"YouTube blocca le richieste";color:#ff3b30;font-size:13px;font-weight:600;line-height:1.25}
.xtile.xyt .xn{background:#ff3b30}
/* classifiche: posizione con ▲▼ e «nuovo», brani che la libreria non ha (o in arrivo dalla musica libera) */
.cllead{display:flex;align-items:center;gap:10px}
.clpos{width:30px;display:flex;flex-direction:column;align-items:center;font-variant-numeric:tabular-nums;line-height:1.15}
.clpos b{font-size:16px;font-weight:600}
.clpos small{font-size:12px;color:var(--fg2);white-space:nowrap}
.cls{font-style:normal;font-size:11px;font-weight:700;color:var(--fg3)}
.cls.su{color:#34c759}
.cls.giu{color:#ff3b30}
.cls.nuovo{color:var(--accent);font-size:10px;text-transform:uppercase}
.trk.clno .tx,.trk.clno .art{opacity:.5}
.xtile .xn{position:absolute;top:10px;right:10px;min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;line-height:22px;text-align:center}
.xtile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;background:var(--bg2);text-align:left;min-height:118px}
.xtile .xi{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:22px}
.xtile b{font-weight:600;font-size:16px}
.xtile span{font-size:13px;color:var(--fg2);line-height:1.25}
#dlpill{position:fixed;z-index:32;right:max(8px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 54px);display:flex;align-items:center;gap:5px;padding:6px 10px;border-radius:99px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 2px 10px rgba(0,0,0,.16),inset 0 0 0 .5px var(--sep);font-size:13px;font-weight:600;color:var(--accent)}
#dlpill svg{font-size:15px}

/* player a tutto schermo */
#np{position:fixed;inset:0;z-index:50;color:#fff;background:var(--npbg,#2c2c2e);transform:translateY(100%);visibility:hidden;transition:transform .48s cubic-bezier(.32,.72,0,1),visibility 0s .48s;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) max(26px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(26px,env(safe-area-inset-left,0px));touch-action:none}
#np::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.35) 100%);pointer-events:none}
#np.open{transform:none;visibility:visible;transition:transform .48s cubic-bezier(.32,.72,0,1),visibility 0s}
#np.drag{transition:none}
#np>*{position:relative}
.grab{width:40px;height:5px;border-radius:3px;background:rgba(255,255,255,.45);margin:4px auto 10px;flex:none}
.grabhit{position:absolute!important;top:0;left:0;right:0;height:44px}
.npin{width:100%;max-width:440px;flex:1;display:flex;flex-direction:column;min-height:0}
.npart{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;padding:10px 0}
.npart .art{width:min(100%,46vh);aspect-ratio:1;border-radius:12px;box-shadow:0 22px 50px rgba(0,0,0,.4);transition:transform .55s cubic-bezier(.34,1.4,.64,1);background:linear-gradient(160deg,#48484a,#2c2c2e)}
.npart .art .ph{color:rgba(255,255,255,.4)}
.npart{position:relative}
#npVid{width:100%;max-height:46vh;aspect-ratio:16/9;border-radius:12px;background:#000;object-fit:contain;box-shadow:0 22px 50px rgba(0,0,0,.4)}
#np.vid .npart .art{display:none}
#npVidMsg{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);padding:5px 11px;border-radius:99px;background:rgba(0,0,0,.45);color:#fff;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none}
#np.paused .npart .art{transform:scale(.8)}
.npq{flex:1;display:none;flex-direction:column;min-height:0}
#np.q .npart,#np.q .npmeta{display:none}
#np.q .npq{display:flex}
.npqhead{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.npqhead .art{width:60px;height:60px;border-radius:7px;background:linear-gradient(160deg,#48484a,#2c2c2e)}
.npqhead .tx{flex:1;min-width:0}
.npqhead b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npqhead span{opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qbar h4{flex:1;margin:0;font-size:17px}
.qbar small{display:block;opacity:.6;font-weight:400;font-size:13px}
.tg{width:42px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.75)}
.tg.on{background:rgba(255,255,255,.88);color:var(--npc,#333)}
.qlist{flex:1;overflow-y:auto;touch-action:pan-y;margin:0 -8px;padding:0 8px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 12px,#000 calc(100% - 12px),transparent 100%)}
.qrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:7px 0;border-bottom:.5px solid rgba(255,255,255,.14)}
.qrow .art{width:44px;height:44px;border-radius:5px;background:linear-gradient(160deg,#48484a,#2c2c2e)}
.qrow .tx{flex:1;min-width:0}
.qrow b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow span{display:block;font-size:14px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qempty{opacity:.6;padding:20px 0;font-size:15px}
.npmeta{display:flex;align-items:center;gap:10px;margin:8px 0 14px}
.npmeta .tx{flex:1;min-width:0}
.npmeta b{display:block;font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npmeta span{display:block;font-size:20px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:17px;flex:none}
.cb.on{color:#fff}
input[type=range].rg{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:none;margin:0;touch-action:none;--p:0%}
.rg::-webkit-slider-runnable-track{height:7px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.85) var(--p),rgba(255,255,255,.22) var(--p));transition:height .2s}
.rg::-webkit-slider-thumb{-webkit-appearance:none;width:7px;height:7px;opacity:0}
.rg::-moz-range-track{height:7px;border-radius:4px;background:rgba(255,255,255,.22)}
.rg::-moz-range-progress{height:7px;border-radius:4px;background:rgba(255,255,255,.85)}
.rg::-moz-range-thumb{width:7px;height:7px;opacity:0;border:0}
.rg:active::-webkit-slider-runnable-track{height:11px;background:linear-gradient(90deg,#fff var(--p),rgba(255,255,255,.28) var(--p))}
.times{display:flex;justify-content:space-between;font-size:12px;font-weight:500;opacity:.6;font-variant-numeric:tabular-nums;margin-top:2px}
.ctrls{display:flex;align-items:center;justify-content:space-evenly;margin:18px 0 18px}
.ctrls button{display:grid;place-items:center;border-radius:50%;transition:transform .15s,background .15s}
.ctrls button:active{transform:scale(.86);background:rgba(255,255,255,.12)}
.ctrls .sk{font-size:38px;width:64px;height:64px}
.ctrls .pp{font-size:50px;width:78px;height:78px}
.vol{display:flex;align-items:center;gap:12px;opacity:.85;font-size:13px}
.npbot{display:flex;justify-content:space-around;margin-top:16px}
.npbot button{width:44px;height:36px;display:grid;place-items:center;font-size:22px;opacity:.75;border-radius:8px}
.npbot button.on{opacity:1;background:rgba(255,255,255,.18)}

/* schede d'azione */
#sh{position:fixed;inset:0;z-index:80;visibility:hidden;transition:visibility 0s .3s}
#sh.open{visibility:visible;transition:none}
#sh .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .3s}
#sh.open .scrim{opacity:1}
#sh .sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));transform:translateY(105%);transition:transform .34s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;gap:8px;max-height:88%}
#sh.open .sheet{transform:none}
.grp{background:var(--sheet);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;flex:none}
.grp.scroll{overflow-y:auto;flex:1 1 auto}
.grp>button,.grp>.srow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:0 16px;min-height:52px;font-size:17px;border-bottom:.5px solid var(--sep)}
.grp>button:last-child{border-bottom:0}
.grp>button .l{flex:1}
.grp>button svg{font-size:21px;color:var(--fg)}
.grp>button.red,.grp>button.red svg{color:#ff3b30}
.grp>button.acc,.grp>button.acc svg{color:var(--accent)}
.grp>button:active{background:var(--fill)}
.cancel{justify-content:center!important;font-weight:600;color:var(--accent)}
.shead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:.5px solid var(--sep)}
.shead .art{width:48px;height:48px;border-radius:6px}
.shead .tx{flex:1;min-width:0}
.shead b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.shead span{display:block;color:var(--fg2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.smsg{padding:16px;text-align:center;color:var(--fg2);font-size:14px;line-height:1.4;border-bottom:.5px solid var(--sep)}
.smsg b{display:block;color:var(--fg);font-size:17px;margin-bottom:4px}
.sform{padding:16px;display:flex;flex-direction:column;gap:12px}
.sform label{font-weight:600}
.sform input{font:inherit;color:var(--fg);background:var(--fill);border:0;border-radius:10px;height:44px;padding:0 12px;outline:none}
.sform .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sform .row2 button{height:46px;border-radius:10px;background:var(--fill);font-weight:600}
.sform .row2 button.pri{background:var(--accent);color:var(--onaccent)}
.sform .rowq{display:flex;gap:10px}
.sform .rowq input{flex:1;min-width:0;-webkit-appearance:none;appearance:none}
.sform .rowq button{height:44px;padding:0 16px;border-radius:10px;background:var(--accent);color:var(--onaccent);font-weight:600}
.sform .nota{font-size:13px;color:var(--fg2);margin-top:-4px}
.steps{padding:16px;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.35}
.steps div{display:flex;gap:12px;align-items:flex-start}
.steps i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;flex:none}

#toast{position:fixed;z-index:90;left:50%;bottom:calc(128px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--sheet);color:var(--fg);box-shadow:0 8px 30px rgba(0,0,0,.22);border-radius:14px;padding:12px 18px;font-size:15px;font-weight:500;transition:opacity .25s,transform .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#drop{position:fixed;inset:10px;z-index:95;border:3px dashed var(--accent);border-radius:20px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:grid;place-items:center;font-size:22px;font-weight:600;color:var(--accent);pointer-events:none}
.trk .dl{color:var(--fg2);font-size:13px;flex:none}
.dlbar{font-size:14px;color:var(--fg2);margin:-6px 0 12px}
.trk.off .art,.trk.off .tx{opacity:.4}
/* brani ascoltati in Atlante: classifiche e consigli */
.asub{color:var(--fg2);font-size:15px;margin:-6px 0 10px}
.aseg{display:inline-flex;background:var(--fill);border-radius:9px;padding:2px;margin:0 0 8px}
.aseg button{padding:6px 14px;border-radius:7px;font-size:14px;font-weight:600;color:var(--fg2)}
.aseg button.on{background:var(--sheet);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.grp>button>.art{width:40px;height:40px;border-radius:5px}.grp>button>.art svg{color:var(--phi)}
.qasc{padding:18px 0 4px}.qasc h4{margin:0;font-size:17px}.qasc small{display:block;opacity:.6;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>

  </div>
</section>

<div id="xp" hidden><iframe id="xf" title="Modulo" allow="camera; microphone; geolocation; clipboard-read; clipboard-write; screen-wake-lock; web-share; fullscreen"></iframe></div>

function unsave(id) {   // «Togli dall'iPhone»: il file salvato si cancella, il brano resta nella libreria del Mac

  }
  noKeep.add(id); TOLTI.add(id); ls.set('am-tolti', [...TOLTI]);

async function savePl(p) { await dbPut('playlists', p).catch(() => {}); }
async function delTrack(id) {
  const t = T.get(id); if (!t) return;
  saved.delete(id); T.delete(id); nuoviGemelli(); await dbDel('meta', id).catch(() => {}); await dbDel('files', id).catch(() => {}); memFiles.delete(id);
  for (const p of P) if (p.ids.indexOf(id) >= 0) { p.ids = p.ids.filter(x => x !== id); savePl(p); }
  if (t.cover && ![...T.values()].some(x => x.cover === t.cover)) { const c = C.get(t.cover); if (c) URL.revokeObjectURL(c.url); C.delete(t.cover); dbDel('covers', t.cover).catch(() => {}); }
  const wasCur = id === curId;
  const ci = S.queue.indexOf(id);
  S.queue = S.queue.filter(x => x !== id); S.orig = S.orig.filter(x => x !== id);
  if (wasCur) { au.pause(); if (S.queue.length) load(Math.min(ci, S.queue.length - 1), false); else stop(); }

/* ---------- videoclip sincronizzati con il brano ----------

   salto (mirando avanti di quanto ci mette a saltare); più piccolo → velocità tra 0,92 e 1,08 finché coincide. Dove la mappa non copre quel punto: la copertina.

   spento). Comandando un altro dispositivo segue la posizione stimata di quello. */

    const j = r.ok ? await r.json() : null;

  const b = vidBrano(), info = b && b.sid === VID.sid ? VID.info : null;
  toast(VID.on ? (info && info.stato === 'nessuno' ? 'Video acceso su questo dispositivo (questo brano non ha un videoclip)' : 'Video acceso su questo dispositivo') : 'Video spento su questo dispositivo: niente dati per i videoclip');

   Tasti: per la musica brano precedente e successivo; per podcast e audiolibri (brani di passaggio, lettore auX)
   indietro e avanti di qualche secondo (15 sull'iPhone, che ne mostra l'icona; altrove 15 indietro e 30 avanti). Mai
   tutti e due insieme: con i salti registrati l'iPhone mostra quelli al posto di precedente/successivo.
   Safari tiene i tasti solo se li si registra quando un lettore è già attivo (prima li perde e mostra i salti di 15 s):
   si registrano di nuovo a ogni partenza. E per Safari un lettore qualsiasi che si ferma (quello che finisce nel mix,
   il videoclip muto, il silenzio che sblocca i lettori) ferma anche la Media Session: dopo ogni evento di un lettore
   stato e posizione si rimettono da quello in uso («au», che nel mix cambia).

  return t && t.ext && au.duration !== Infinity ? 'parlato' : 'musica';

    case 'next': avanti(); break;   // con il mix acceso: il passaggio a tempo anche dalla schermata di blocco

/* ---------- AirPlay e Chromecast ----------
   Safari (iPhone, iPad, Mac): AirPlay. Il tasto compare solo quando c'è un'uscita da scegliere (evento

   il Centro di Controllo: ci passano tutti e tre i lettori e anche il mixer del mix a tempo (Web Audio), quindi resta
   tutto com'è. Sul Mac invece Safari manda ad AirPlay un lettore solo: dopo averlo scelto da qui i brani cambiano sullo
   stesso lettore, che tiene l'altoparlante, e il mix a tempo non passa all'altro (suonerebbe dal Mac).
   Chrome ed Edge (Android, Windows, Mac, Linux): Chromecast con la Remote Playback API, anche questa per un lettore
   solo (stesse regole). Un file salvato sul dispositivo non si trasmette: mentre trasmette, i brani della libreria
   arrivano dal Mac. Su Android il brano lo scarica il Chromecast stesso dall'indirizzo, e quello del Mac (rete Tailscale,
   o con la password da Internet) non lo raggiunge: lì si trasmettono podcast e audiolibri, e il tasto spiega perché.
   Firefox e gli altri: niente tasto; l'uscita (Bluetooth, AirPlay del Mac…) si sceglie nel sistema e l'app la segue. */
