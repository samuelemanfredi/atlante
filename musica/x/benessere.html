<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Benessere</title>
<link rel="stylesheet" href="kit.css">
<script src="kit.js"></script>
<style>
:root{--c-kcal:var(--accent);--c-pro:#007aff;--c-carb:#ff9500;--c-fat:#af52de;--c-h2o:#32ade6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-pro:#0a84ff;--c-carb:#ff9f0a;--c-fat:#bf5af2;--c-h2o:#64d2ff}}
:root[data-theme="dark"]{--c-pro:#0a84ff;--c-carb:#ff9f0a;--c-fat:#bf5af2;--c-h2o:#64d2ff}
.tabsbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:4px 0 6px}
.tabsbar .seg{margin:0}
.h2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:28px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"›";margin-left:auto;color:var(--fg3);font-size:22px;line-height:1;transition:transform .2s}
details[open]>summary::after{transform:rotate(90deg)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 8px}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 4px}
.daynav b{font-size:19px;text-align:center;flex:1;min-width:0}
.daynav .btn{min-width:44px;padding:0;font-size:22px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.ring{position:relative;width:100%;max-width:78px;margin:0 auto}
.ring svg{width:100%;height:auto;display:block;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.ring .v small{font-size:10px;font-weight:500;color:var(--fg2)}
.rl{font-size:12px;color:var(--fg2);margin-top:4px}
.center{text-align:center;justify-content:center}
.mh{background:transparent}
.kc{font-variant-numeric:tabular-nums;color:var(--fg2);font-size:15px;white-space:nowrap}
.row .ph{display:grid;place-items:center;font-size:22px}
.row .ico{width:36px;height:36px;font-size:20px;border-radius:8px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--fg2);font-size:10px;font-family:var(--font)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--fg2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.srch{display:flex;gap:8px;align-items:center}
.srch .in{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.chip{padding:7px 12px;border-radius:99px;background:var(--fill);font-size:14px;min-height:34px}
.chip.on{background:var(--accent);color:var(--onaccent)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:.5px solid var(--sep);font-size:15px}
.kv:last-child{border-bottom:0}
.kv span:last-child{font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;margin:10px 0}
.tl{background:var(--card);border-radius:10px;padding:10px}
.tl small{display:block;font-size:12px;color:var(--fg2)}
.tl b{font-size:19px;font-variant-numeric:tabular-nums}
.tips{margin:6px 0;padding-left:20px}
.tips li{margin:6px 0;font-size:15px}
.ai{white-space:normal;font-size:15px;background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 4px;text-align:right;border-bottom:.5px solid var(--sep);white-space:nowrap}
.tbl td:first-child{white-space:normal}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:12px;color:var(--fg2);font-weight:600}
.tbl tr:last-child td{border-bottom:0}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.dayh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 14px 4px;font-weight:600}
.dayh span{font-weight:400;color:var(--fg2);font-size:14px;text-align:right}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.links a{padding:6px 10px;border-radius:9px;background:var(--fill);font-size:14px;font-weight:600}
.sup{background:var(--card);border-radius:10px;padding:12px;margin:8px 0}
.sup h3{font-size:17px;margin:0 0 4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sup p{margin:6px 0;font-size:14px}
.steps{padding-left:22px;margin:8px 0;font-size:15px}
.steps li{margin:5px 0}
.exl{list-style:none;padding:0;margin:6px 0}
.exl li{border-bottom:.5px solid var(--sep);padding:8px 0}
.exl li:last-child{border-bottom:0}
.exl summary{flex-wrap:nowrap;align-items:baseline}
.exl summary b{font-weight:600;flex:1;min-width:0}
.exl summary span{color:var(--fg2);font-size:14px;margin-left:auto;white-space:nowrap}
.exl summary::after{display:none}
.exl p{margin:6px 0;font-size:14px}
.fase{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2);margin:12px 0 2px;font-weight:600}
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet .sh{position:sticky;top:0;z-index:3;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;min-height:50px;padding:env(safe-area-inset-top,0px) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));border-bottom:.5px solid var(--sep)}
.sheet .sh b{font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.sheet .sh>button,.sheet .sh>span>button{color:var(--accent);font-size:17px;padding:10px 0;justify-self:start}
.sheet .sh>span{justify-self:end}
.sheet .sb{max-width:900px;margin:0 auto;padding:8px max(16px,env(safe-area-inset-left,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
.qhead{display:flex;gap:12px;align-items:center;margin:8px 0}
.qhead img,.qhead .ph{width:64px;height:64px;border-radius:10px;object-fit:cover;background:var(--fill);flex:none;display:grid;place-items:center;font-size:28px}
.qhead b{display:block;font-size:19px}
.scan{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;max-height:52vh;margin:8px auto}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scLine{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.ses{text-align:center;padding-top:6px}
.ses .timer{font-size:72px;line-height:1.05;font-weight:700;font-variant-numeric:tabular-nums;margin:8px 0;letter-spacing:-1px}
.ses h2{font-size:26px;margin:8px 0 2px}
.ses .tg{font-size:20px;font-weight:600;color:var(--accent);margin:0 0 8px}
.ses .ds{font-size:15px;color:var(--fg2);max-width:560px;margin:6px auto}
.ses .btns{justify-content:center}
.ph-lavoro{color:var(--ok)}.ph-rec{color:var(--link)}.ph-prep{color:var(--warn)}
.prow{display:flex;justify-content:space-between;gap:10px;align-items:baseline;padding:8px 0;border-bottom:.5px solid var(--sep);font-size:15px}
.prow:last-child{border-bottom:0}
.prow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.met{width:76px!important;flex:none;text-align:right}
.mini{font-size:12px;color:var(--fg2)}
.pz .tx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:15px}
@media (max-width:360px){.lt{font-size:28px}.ring .v{font-size:12px}.ses .timer{font-size:60px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="tabsbar"><div class="seg" id="tabs" role="tablist">
    <button data-a="tab" data-t="cal" role="tab" class="on">Calorie</button>
    <button data-a="tab" data-t="set" role="tab">Settimana</button>
    <button data-a="tab" data-t="tr" role="tab">Trainer</button>
  </div></div>
  <div id="macNote" class="note" hidden></div>
  <section id="t-cal">
    <div id="cProf"></div><div id="cDay"></div><div id="cChart"></div><div id="cPeso"></div><div id="cTips"></div>
  </section>
  <section id="t-set" hidden></section>
  <section id="t-tr" hidden></section>
  <p class="small" style="margin-top:28px">Stime indicative per adulti sani: non sostituiscono il medico, il dietista o il farmacista. I dati restano su questo dispositivo.</p>
</div>
<div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="shT">
  <div class="sh"><button id="shBack" data-a="shClose">Chiudi</button><b id="shT"></b><span id="shR"></span></div>
  <div class="sb" id="shB"></div>
</div>
<input type="file" id="fIcs" accept=".ics,.ical,.ifb,text/calendar" hidden>
<input type="file" id="fSal" accept=".csv,.json,.txt,text/csv,application/json,text/plain" hidden>
<script>
'use strict';
/* ====================== utilità ====================== */
const {$, esc, toast} = AX;
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const pYmd = s => { const a = String(s).split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); };
const addD = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const oggi = () => ymd(new Date());
const num = v => { const n = parseFloat(String(v == null ? '' : v).replace(/\s/g, '').replace(',', '.')); return isFinite(n) ? n : 0; };
const f0 = n => Math.round(+n || 0).toLocaleString('it-IT');
const f1 = n => (Math.round((+n || 0) * 10) / 10).toLocaleString('it-IT');
const r1 = n => Math.round((+n || 0) * 10) / 10;
const f2 = n => (Math.round((+n || 0) * 100) / 100).toLocaleString('it-IT');
const pl = (n, a, b) => n + ' ' + (n === 1 ? a : b);
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const uid = () => Math.random().toString(36).slice(2, 10);
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, ' ');
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
const GIORNI = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
const GG = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const MESI = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
const MESI3 = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
const dataLunga = s => { const d = pYmd(s); return GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + MESI[d.getMonth()]; };
const dataBreve = s => { const d = pYmd(s); return d.getDate() + ' ' + MESI3[d.getMonth()]; };
const ora = t => { const d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const durTxt = h => { const m = Math.round(h * 60); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h' + (m % 60 ? ' ' + pad(m % 60) : ''); };
const testo = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
// doppio tocco al posto di confirm()
function conferma(btn, msg) {
  if (btn.dataset.ok && Date.now() - +btn.dataset.ok < 4000) return true;
  btn.dataset.ok = Date.now(); const t = btn.textContent; btn.textContent = msg || 'Tocca di nuovo per confermare';
  setTimeout(() => { if (btn.isConnected) { btn.textContent = t; delete btn.dataset.ok; } }, 4000);
  return false;
}
function jsonDa(t) {   // risposta dell'IA → oggetto (tollera testo intorno)
  if (t && typeof t === 'object') return t;
  try { return JSON.parse(t); } catch (e) {}
  const m = String(t || '').match(/\{[\s\S]*\}/); if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  return null;
}

/* ====================== archivio (IndexedDB ax-benessere, ripiego AX.store) ====================== */
const KEYS = ['profilo', 'diario', 'personali', 'preferiti', 'recenti', 'pesi', 'sett', 'trainer'];
const DB = {
  db: null, c: {},
  async init() {
    this.db = await new Promise(res => {
      let fatto = false; const fin = v => { if (!fatto) { fatto = true; res(v); } };
      setTimeout(() => fin(null), 3000);
      try {
        const r = indexedDB.open('ax-benessere', 1);
        r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
        r.onsuccess = () => fin(r.result); r.onerror = () => fin(null); r.onblocked = () => fin(null);
      } catch (e) { fin(null); }
    });
    if (this.db) {
      try {
        await new Promise((res, rej) => {
          const q = this.db.transaction('kv', 'readonly').objectStore('kv').openCursor();
          q.onsuccess = () => { const c = q.result; if (c) { this.c[c.key] = c.value; c.continue(); } else res(); };
          q.onerror = () => rej(q.error);
        });
      } catch (e) { this.db = null; }
    }
    if (!this.db) KEYS.forEach(k => { const v = AX.store.get('benessere-' + k, undefined); if (v !== undefined) this.c[k] = v; });
  },
  get(k, d) { return k in this.c ? this.c[k] : d; },
  set(k, v) {
    this.c[k] = v;
    const ripiego = () => AX.store.set('benessere-' + k, v);
    if (!this.db) return ripiego();
    try { const tx = this.db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.onerror = ripiego; } catch (e) { ripiego(); }
  },
  save(k) { this.set(k, this.c[k]); }
};
const diario = () => DB.c.diario || (DB.c.diario = {});
const lista = k => DB.c[k] || (DB.c[k] = []);
const sett = () => { const s = DB.c.sett || (DB.c.sett = {}); return Object.assign(s, Object.assign({eventi: [], met: {}, cat: {}, ore: {}, fondo: 1.1, energia: {}, url: '', fonte: '', agg: '', query: {}}, s)); };
const TR = () => { const t = DB.c.trainer || (DB.c.trainer = {}); return Object.assign(t, Object.assign({q: null, piano: null, storico: [], prog: {}}, t)); };

/* ====================== stato del Mac / IA ====================== */
let MAC = {ok: false}, IA = false;
async function initMac() {
  MAC = await AX.stato();
  if (MAC.ok) { try { const j = await AX.api('ia', {timeout: 8000}); IA = !!(j && j.attiva && (!Array.isArray(j.modelli) || j.modelli.length)); } catch (e) { IA = !!MAC.ollama; } }
  const n = $('macNote');
  if (!MAC.ok) { n.hidden = false; n.textContent = 'Il Mac non risponde: conta calorie, file .ics, dati di Salute, Trainer e link dei prezzi funzionano lo stesso; IA locale, calendari da URL e «Cerca prezzi con il Mac» tornano quando il Mac è acceso.'; }
  else if (!IA) { n.hidden = false; n.textContent = 'Mac collegato, IA locale non attiva (avvia Ollama sul Mac): uso consigli e piani calcolati con regole.'; }
  else n.hidden = true;
  const p = $('iaPill'); if (p) { p.className = 'pill ' + (IA ? 'ok' : ''); p.textContent = IA ? 'IA locale attiva' : (MAC.ok ? 'IA spenta' : 'Mac non raggiungibile'); }
  // aggiorna solo le parti che dipendono dal Mac, senza perdere ciò che si sta scrivendo
  const scrive = id => { const a = document.activeElement; return a && $(id).contains(a) && /INPUT|SELECT|TEXTAREA/.test(a.tagName); };
  renderTips();
  if (!scrive('t-set')) renderSett();
  const g = document.querySelector('[data-a="generaIA"]'); if (g) g.disabled = !IA;
}

/* ====================== profilo e fabbisogno ====================== */
const ATT = [
  {k: 'sedentario', t: 'Sedentario (poco o nessun esercizio)', f: 1.2},
  {k: 'leggero', t: 'Leggero (1–3 allenamenti a settimana)', f: 1.375},
  {k: 'moderato', t: 'Moderato (3–5 allenamenti a settimana)', f: 1.55},
  {k: 'attivo', t: 'Attivo (6–7 allenamenti a settimana)', f: 1.725},
  {k: 'molto', t: 'Molto attivo (lavoro fisico o 2 al giorno)', f: 1.9}];
const MOB = [
  {k: 'nessuna', t: 'Nessuna', max: 1.9},
  {k: 'lievi', t: 'Lievi (dolori, cammino con fatica)', max: 1.55},
  {k: 'ridotta', t: 'Ridotta (carrozzina, deambulatore, spesso a letto)', max: 1.375}];
const OBIP = [['perdere', 'Perdere'], ['mantenere', 'Mantenere'], ['aumentare', 'Aumentare']];
function calc(p) {
  if (!p) return null;
  const kg = num(p.peso), cm = num(p.altezza), age = num(p.eta);
  if (!(kg >= 25 && kg <= 350 && cm >= 100 && cm <= 250 && age >= 10 && age <= 110)) return null;
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (p.sesso === 'F' ? -161 : 5);   // Mifflin-St Jeor
  const a = ATT.find(x => x.k === p.attivita) || ATT[1], m = MOB.find(x => x.k === p.mobilita) || MOB[0];
  const fatt = Math.min(a.f, m.max), tdee = bmr * fatt;
  const minimo = Math.min(tdee, p.sesso === 'F' ? 1200 : 1500);
  let target = tdee;
  if (p.obiettivo === 'perdere') target = Math.max(minimo, tdee - Math.min(500, tdee * 0.2));
  else if (p.obiettivo === 'aumentare') target = tdee + Math.min(350, tdee * 0.12);
  target = Math.round(target);
  const bmi = kg / ((cm / 100) ** 2);
  const kgRif = bmi > 30 ? 27 * (cm / 100) ** 2 : kg;   // con IMC alto le proteine si calcolano su un peso di riferimento
  const pgk = {perdere: 1.8, mantenere: 1.4, aumentare: 1.7}[p.obiettivo] || 1.4;
  const prot = Math.round(kgRif * pgk), grassi = Math.round(target * 0.28 / 9), carbo = Math.max(0, Math.round((target - prot * 4 - grassi * 9) / 4));
  return {kg, bmr: Math.round(bmr), fatt, tdee: Math.round(tdee), target, prot, carbo, grassi, pgk,
    zuccheri: Math.round(target * 0.10 / 4), fibre: Math.max(25, Math.round(target / 1000 * 14)), sale: 5,
    acqua: Math.max(1500, Math.min(4000, Math.round(kg * 35 / 50) * 50)), bmi, limitato: a.f > m.max, minimo: target <= minimo + 1 && p.obiettivo === 'perdere'};
}
const profilo = () => DB.get('profilo', null);
const C = () => calc(profilo());
function leggiProf() {
  return {sesso: $('pSesso').value, eta: num($('pEta').value) || '', altezza: num($('pAlt').value) || '', peso: num($('pPeso').value) || '',
    obiettivo: $('pObi').dataset.v || 'mantenere', attivita: $('pAtt').value, mobilita: $('pMob').value};
}
function renderProf() {
  const p = Object.assign({sesso: 'M', eta: '', altezza: '', peso: '', obiettivo: 'mantenere', attivita: 'leggero', mobilita: 'nessuna'}, profilo() || {});
  const c = calc(p);
  $('cProf').innerHTML = `<details class="card" id="profD" ${c ? '' : 'open'}><summary><b>Profilo</b><span class="sub" id="profSum">${c ? 'obiettivo ' + f0(c.target) + ' kcal al giorno' : 'da compilare'}</span></summary>
    <div class="f2">
      <div class="field"><label for="pSesso">Sesso</label><select id="pSesso" class="in"><option value="M">Uomo</option><option value="F">Donna</option></select></div>
      <div class="field"><label for="pEta">Età (anni)</label><input id="pEta" class="in" inputmode="numeric" autocomplete="off" value="${esc(p.eta)}"></div>
      <div class="field"><label for="pAlt">Altezza (cm)</label><input id="pAlt" class="in" inputmode="numeric" autocomplete="off" value="${esc(p.altezza)}"></div>
      <div class="field"><label for="pPeso">Peso (kg)</label><input id="pPeso" class="in" inputmode="decimal" autocomplete="off" value="${esc(p.peso === '' ? '' : String(p.peso).replace('.', ','))}"></div>
    </div>
    <div class="field"><label>Obiettivo</label><div class="seg" id="pObi" data-v="${esc(p.obiettivo)}">${OBIP.map(o => `<button data-a="obi" data-v="${o[0]}" class="${o[0] === p.obiettivo ? 'on' : ''}">${o[1]}</button>`).join('')}</div></div>
    <div class="field"><label for="pAtt">Livello di attività</label><select id="pAtt" class="in">${ATT.map(a => `<option value="${a.k}">${a.t}</option>`).join('')}</select></div>
    <div class="field"><label for="pMob">Limitazioni di mobilità</label><select id="pMob" class="in">${MOB.map(a => `<option value="${a.k}">${a.t}</option>`).join('')}</select></div>
    <div id="profRes"></div>
    <div class="btns"><button class="btn pri" data-a="salvaProf">Salva profilo</button></div>
  </details>`;
  $('pSesso').value = p.sesso; $('pAtt').value = p.attivita; $('pMob').value = p.mobilita;
  profPreview();
}
function profPreview() {
  const p = leggiProf(), c = calc(p), el = $('profRes'); if (!el) return;

    const r = await AX.fetchT(u, {}, 20000); if (!r.ok) throw new Error('Open Food Facts ha risposto ' + r.status);

    // ripiego sul nuovo motore search.openfoodfacts.org letto dal Mac (non consente la lettura diretta dal browser), poi la stessa ricerca dal Mac
    const sal = 'https://search.openfoodfacts.org/search?q=' + encodeURIComponent(q) + '&page_size=20&langs=it&fields=' + OFF_FIELDS;
    if (MAC.ok) {
      for (const x of [sal, u]) { try { const r = await AX.proxy(x, 25000); const L = leggi(await r.json()); if (L.length) return L; } catch (e2) {} }
    }

  if (/^p(Eta|Alt|Peso|Sesso|Att|Mob)$/.test(id)) profPreview();

  else if (id === 'evOre' && WCUR) { const n = $('evCalc'); if (n && n.textContent.includes('MET')) { const m = n.textContent.match(/MET ([\d,]+)/); const met = m ? num(m[1]) : 0; n.innerHTML = `kcal = MET ${f1(met)} × ${f1(WCUR.kg)} kg × ${f1(num(e.target.value))} h = <b>${f0(met * WCUR.kg * num(e.target.value))} kcal</b>`; } }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (/^p(Sesso|Att|Mob)$/.test(t.id)) profPreview();
  else if (t.id === 'fondo') { sett().fondo = +t.value; DB.save('sett'); renderSett(); }
  else if (t.dataset && t.dataset.met) { const v = num(t.value), S = sett(); if (v > 0 && v < 25) S.met[t.dataset.met] = v; else delete S.met[t.dataset.met]; DB.save('sett'); renderSett(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SH.length) closeSheet(); });
$('fIcs').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try { await importaIcsTesto(await f.text(), f.name.replace(/\.ics$/i, '')); } catch (x) { toast('File non valido: ' + x.message); }
});
$('fSal').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  try {
    const m = parseEnergia(await f.text()), n = Object.keys(m).length; if (!n) throw new Error('nessuna riga con data e kcal');
    const S = sett(); Object.assign(S.energia, m); DB.save('sett'); renderSett(); toast(pl(n, 'giorno', 'giorni') + ' di energia attiva importat' + (n === 1 ? 'o' : 'i'));
  } catch (x) { toast('Import non riuscito: ' + x.message); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && SES && SES.inizio) wake(true); });
try { speechSynthesis.onvoiceschanged = () => { vIt = null; }; } catch (e) {}

/* ====================== avvio ====================== */
function mostraTab(t) {
  document.querySelectorAll('#tabs button').forEach(b => { const on = b.dataset.t === t; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
  ['cal', 'set', 'tr'].forEach(k => { $('t-' + k).hidden = k !== t; });
  AX.store.set('benessere-tab', t);
  if (t === 'cal') renderCal(); else if (t === 'set') renderSett(); else renderTr();
  scrollTo(0, 0);
}
function renderAll() { renderCal(); renderSett(); renderTr(); }
(async function avvio() {
  AX.header('Benessere', '<span id="iaPill" class="pill">…</span>');
  await DB.init();
  const q = new URLSearchParams(location.search).get('tab'), t = ['cal', 'set', 'tr'].includes(q) ? q : AX.store.get('benessere-tab', 'cal');
  renderAll(); mostraTab(['cal', 'set', 'tr'].includes(t) ? t : 'cal');
  initMac();
  // a mezzanotte il diario passa al nuovo giorno
  let ultimo = oggi(); setInterval(() => { if (oggi() !== ultimo) { if (GIORNO === ultimo) GIORNO = oggi(); ultimo = oggi(); renderCal(); } }, 60000);
})();
</script>
